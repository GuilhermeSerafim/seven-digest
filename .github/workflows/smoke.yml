name: llm-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Run live LLM smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest tests/smoke -v
      - name: Notify on failure
        if: failure()
        env:
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GUILER_PHONE: ${{ secrets.GUILER_PHONE }}
        run: |
          curl -X POST "https://graph.facebook.com/v19.0/${META_PHONE_NUMBER_ID}/messages" \
            -H "Authorization: Bearer ${META_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"messaging_product\":\"whatsapp\",\"to\":\"${GUILER_PHONE}\",\"type\":\"text\",\"text\":{\"body\":\"LLM smoke test falhou — prompt pode ter quebrado.\"}}" \
            || true
