name: weekly-digest

on:
  schedule:
    - cron: "0 21 * * 5"  # Friday 21:00 UTC = 18:00 BRT
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week (YYYY-Www). Empty = current."
        required: false
        type: string
      dry_run:
        description: "Skip WhatsApp send"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout digest-engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Clone source repos
        env:
          REPOS_PAT: ${{ secrets.REPOS_PAT }}
        run: |
          mkdir -p _checkout
          git clone --depth=200 \
            "https://x-access-token:${REPOS_PAT}@github.com/${{ vars.REPOS_OWNER }}/seven_tools_api.git" \
            _checkout/seven_tools_api
          git clone --depth=200 \
            "https://x-access-token:${REPOS_PAT}@github.com/${{ vars.REPOS_OWNER }}/seven_tools_front.git" \
            _checkout/seven_tools_front

      - name: Configure git for archive commit
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          REPORT_URL: "https://${{ github.repository_owner }}.github.io/seven-digest/${{ inputs.week || '' }}/relatorio.pdf"
        run: |
          ARGS=""
          if [ -n "${{ inputs.week }}" ]; then ARGS="$ARGS --week ${{ inputs.week }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m digest_engine $ARGS

      - name: Notify on failure
        if: failure()
        env:
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GUILER_PHONE: ${{ secrets.GUILER_PHONE }}
        run: |
          curl -X POST "https://graph.facebook.com/v19.0/${META_PHONE_NUMBER_ID}/messages" \
            -H "Authorization: Bearer ${META_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"messaging_product\":\"whatsapp\",\"to\":\"${GUILER_PHONE}\",\"type\":\"text\",\"text\":{\"body\":\"Pipeline digest falhou — ver Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}" \
            || true
